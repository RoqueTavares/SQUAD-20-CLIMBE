services:
  db:
    image: postgres:14-alpine
    container_name: postgres_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=user_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "61613:61613"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp &&
             rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: spring_api
    restart: on-failure
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      - db
      - rabbitmq
    env_file:
      - .env

    dns:
      - 8.8.8.8
      - 8.8.4.4

    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/user_db
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin
      - APP_WEBSOCKET_BROKER_RELAY_ENABLED=${APP_WEBSOCKET_BROKER_RELAY_ENABLED:-false}
      - APP_WEBSOCKET_BROKER_RELAY_HOST=${APP_WEBSOCKET_BROKER_RELAY_HOST:-rabbitmq}
      - APP_WEBSOCKET_BROKER_RELAY_PORT=${APP_WEBSOCKET_BROKER_RELAY_PORT:-61613}
      - APP_WEBSOCKET_BROKER_RELAY_CLIENT_LOGIN=${APP_WEBSOCKET_BROKER_RELAY_CLIENT_LOGIN:-admin}
      - APP_WEBSOCKET_BROKER_RELAY_CLIENT_PASSCODE=${APP_WEBSOCKET_BROKER_RELAY_CLIENT_PASSCODE:-admin}
      - APP_WEBSOCKET_BROKER_RELAY_SYSTEM_LOGIN=${APP_WEBSOCKET_BROKER_RELAY_SYSTEM_LOGIN:-admin}
      - APP_WEBSOCKET_BROKER_RELAY_SYSTEM_PASSCODE=${APP_WEBSOCKET_BROKER_RELAY_SYSTEM_PASSCODE:-admin}
      - APP_WEBSOCKET_BROKER_RELAY_VIRTUAL_HOST=${APP_WEBSOCKET_BROKER_RELAY_VIRTUAL_HOST:-/}
      - APP_WEBSOCKET_BROKER_RELAY_USER_DESTINATION_BROADCAST=${APP_WEBSOCKET_BROKER_RELAY_USER_DESTINATION_BROADCAST:-/topic/unresolved-user-destinations}
      - APP_WEBSOCKET_BROKER_RELAY_USER_REGISTRY_BROADCAST=${APP_WEBSOCKET_BROKER_RELAY_USER_REGISTRY_BROADCAST:-/topic/simp-user-registry}
    volumes:
      - ${GCP_CREDENTIALS_HOST_PATH:-./src/main/resources/gcp-credentials.json}:/app/gcp-credentials.json:ro

volumes:
  postgres_data:
  rabbitmq_data:
