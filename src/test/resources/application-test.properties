# Perfil test: H2 em memória para testes não dependerem de PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT (valor fixo para testes)
jwt.secret=NDBONDYzNTI2NjU1NkE1ODZFMzI3MjM1NzUzODc4MkY0MTNGNDQyODQ3MkI0QjYyNTA2NDUzNjc1NjZCNTk3MA==
jwt.expiration-ms=86400000

# Mock Mail settings for tests
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test

# RabbitMQ, OAuth2 Google e GCP Storage têm seus beans mockados em
# TestExternalsConfig (perfil test). As properties abaixo existem apenas
# para que o contexto Spring resolva @Value e auto-config dependentes.
spring.rabbitmq.listener.simple.auto-startup=false
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
gcp.credentials.file.path=classpath:gcp-credentials-test.json
gcp.bucket.name=test-bucket
